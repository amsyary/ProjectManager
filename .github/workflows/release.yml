# Builds the Windows installer and portable exe.
# - Push a tag like v1.2.3: build, then publish a GitHub Release with both downloads.
# - Pull requests and manual runs: build only (downloads are attached to the run as artifacts).
name: Build and release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Work out the version
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $version = "0.0.0-ci.${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Build portable exe
        run: python -m PyInstaller --clean --noconfirm ProjectManager.spec

      - name: Build folder version for the installer
        env:
          PM_ONEDIR: "1"
        run: python -m PyInstaller --clean --noconfirm ProjectManager.spec

      - name: Smoke test (the app starts and keeps running)
        run: |
          $p = Start-Process dist\ProjectManager\ProjectManager.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "ProjectManager.exe exited early with code $($p.ExitCode)" }
          Get-Process ProjectManager -ErrorAction SilentlyContinue | Stop-Process -Force
          Remove-Item -Recurse -Force dist\ProjectManager\data, dist\ProjectManager\config -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} installer\ProjectManager.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Collect downloads
        run: |
          $v = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "installer\Output\ProjectManager-Setup-$v-x64.exe" release\
          Copy-Item dist\ProjectManager.exe "release\ProjectManager-$v-portable-x64.exe"
          Get-ChildItem release\*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release\SHA256SUMS.txt
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ProjectManager-${{ steps.version.outputs.version }}-windows-x64
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-windows
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Download

            | File | Use it when |
            |---|---|
            | `ProjectManager-Setup-…-x64.exe` | You want it installed: Start-menu entry, optional desktop shortcut, uninstaller. No admin rights needed. |
            | `ProjectManager-…-portable-x64.exe` | You want a single file with nothing installed. It keeps its `data` and `config` folders next to itself. |

            Requires Windows 10 or 11 (64-bit). On Windows on ARM it runs under x64 emulation.

            The files are not code-signed yet, so Windows SmartScreen may say "Windows protected your PC": click **More info → Run anyway**. `SHA256SUMS.txt` lists the checksums.

            Upgrading: run the new installer over the old one. Your projects, snippets and settings are kept.
